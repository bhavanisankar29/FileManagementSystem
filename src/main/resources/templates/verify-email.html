<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - File Management System</title>
    <link rel="stylesheet" th:href="@{/css/verify-email.css}">
</head>
<body>
<div class="page-title">File Management System</div>
<div class="container">
    <div class="header">
        <h1>Verify Email</h1>
        <p>Enter the verification code sent to your email</p>
    </div>

    <div class="message error" th:if="${param.error}">
        <p>Invalid OTP</p>
    </div>

    <div class="message success" th:if="${param.resend}">
        <p>OPT resent successfully</p>
    </div>

    <form th:action="@{/verify-email}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${email}"  readonly required />
        </div>

        <div class="form-group">
            <label for="otp">Verification Code</label>
            <input type="text" id="otp" name="otp" required placeholder="Enter verification code" maxlength="6">
        </div>

        <div class="button-container">
            <button type="submit" class="submit-btn">Verify Email</button>
        </div>
    </form>

    <form th:action="@{/resend-otp}" method="post">
        <div class="button-container">
            <button type="submit" class="resend-btn">Resend OTP</button>
        </div>
    </form>
</div>
</body>
</html>
