<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - File Management System</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>
<body>
<div class="page-title">File Management System</div>
<div class="container">
    <div class="header">
        <h1>Create New Password</h1>
        <p>Set a strong password for your account</p>
    </div>

    <div class="message error" th:if="${passwordError}">
        <p th:text="${passwordError}"></p>
    </div>

    <div class="message error" th:if="${passwordWeak}">
        <p th:text="${passwordWeak}"></p>
    </div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${userEmail}" />

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="password" required autocomplete="new-password" placeholder="Enter new password">
            <div class="password-strength" id="strengthIndicator"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Confirm password">
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
    </form>

    <div class="back-link">
        <a th:href="@{/login}">Back to Sign in</a>
    </div>
</div>

<script>
    const newPasswordInput = document.getElementById('newPassword');
    const strengthIndicator = document.getElementById('strengthIndicator');

    newPasswordInput.addEventListener('input', function() {
        const password = this.value;
        let strength = '';

        if (password.length === 0) {
            strengthIndicator.textContent = '';
        } else if (password.length < 8) {
            strength = 'Weak password';
            strengthIndicator.className = 'password-strength weak';
            strengthIndicator.textContent = strength;
        } else if (!/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
            strength = 'Fair password (add uppercase and numbers)';
            strengthIndicator.className = 'password-strength fair';
            strengthIndicator.textContent = strength;
        } else {
            strength = 'Good password';
            strengthIndicator.className = 'password-strength good';
            strengthIndicator.textContent = strength;
        }
    });
</script>
</body>
</html>
