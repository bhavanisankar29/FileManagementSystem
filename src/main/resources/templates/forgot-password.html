<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - File Management System</title>
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div class="page-title">File Management System</div>
<div class="container">
    <div class="header">
        <h1>Reset Password</h1>
        <p>Enter your email to receive OTP</p>
    </div>

    <div class="message error" th:if="${noUserFound}">
        <p th:text="${noUserFound}"></p>
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <button type="submit" class="submit-btn">Send OTP</button>
    </form>

    <div class="back-link">
        <a th:href="@{/login}">Back to Sign in</a>
    </div>
</div>
</body>
</html>
