<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - File Management System</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="page-title">File Management System</div>
<div class="login-container">
    <div class="login-header">
        <h1>Sign in</h1>
        <p>Enter your credentials to continue</p>
    </div>


    <div class="error-message" th:if="${param.error}">
        <p>Invalid email or password</p>
    </div>

    <div class="success-message" th:if="${param.logout}">
        <p>You have been logged out</p>
    </div>

    <div class="success-message" th:if="${param.Success}">
        <p>Signup successful. Please login.</p>
    </div>



    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="username" required autocomplete="email">
        </div>

        <div class="form-group">
            <div class="password-label-group">
                <label for="password">Password</label>
                <a th:href="@{/forgot-password}">Forgot password?</a>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="submit-btn">Sign in</button>
    </form>
    <div class="forgot-password">
        <p>Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
    </div>
</div>
</body>
</html>
